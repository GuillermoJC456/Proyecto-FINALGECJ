name: Calidad y despliegue de prueba
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/
  sonar:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage/
      - name: Verificar configuración requerida
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_HOST_URL" && test -n "$SONAR_TOKEN"
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Exportar métricas del análisis completado
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mkdir -p reports
          curl --fail --silent --show-error -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/measures/component?component=registro-donantes&metricKeys=coverage,bugs,vulnerabilities,code_smells,sqale_index,duplicated_lines_density,security_hotspots" -o reports/sonar-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: sonar-metrics
          path: reports/sonar-metrics.json
  staging:
    if: github.event_name != 'pull_request'
    needs: [test, sonar]
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir y desplegar entorno temporal aislado
        run: |
          docker build -t donantes:test .
          JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          docker run -d --name donantes -p 127.0.0.1:3000:3000 -e JWT_SECRET="$JWT_SECRET" donantes:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: ZAP autenticado sobre API de prueba
        run: |
          mkdir -p reports
          chmod 777 reports
          USER_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$USER_PASSWORD"
          curl --fail -s http://localhost:3000/register -H 'Content-Type: application/json' -d "{\"username\":\"zapuser\",\"password\":\"$USER_PASSWORD\"}"
          TOKEN=$(curl --fail -s http://localhost:3000/login -H 'Content-Type: application/json' -d "{\"username\":\"zapuser\",\"password\":\"$USER_PASSWORD\"}" | jq -r .token)
          test "$TOKEN" != null
          echo "::add-mask::$TOKEN"
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $TOKEN" -e ZAP_AUTH_HEADER_SITE=localhost ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -r reports/zap.html -J reports/zap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap
          path: reports/
      - name: Retirar entorno temporal
        if: always()
        run: docker rm -f donantes || true
