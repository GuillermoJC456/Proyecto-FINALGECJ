name: Calidad y despliegue de prueba
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar-y-desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_HOST_URL: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Pruebas y auditoría
        run: |
          mkdir -p reports/unitarias reports/seguridad
          pnpm exec jest --runInBand --coverage --json --outputFile=reports/unitarias/jest-results.json
          pnpm audit --prod --json > reports/seguridad/dependencias.json
      - name: SonarQube temporal
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name sonar -p 127.0.0.1:9000:9000 sonarqube:26.9.0.129388-community
          python scripts/sonar-ci.py setup
      - uses: SonarSource/sonarqube-scan-action@v6
      - name: Exportar métricas y liberar recursos
        run: |
          python scripts/sonar-ci.py export
          docker stop sonar
      - name: Despliegue automático en entorno de prueba
        if: github.event_name != 'pull_request'
        run: |
          docker build -t donantes:test .
          JWT_SECRET=$(openssl rand -hex 32)
          SCAN_PASSWORD=$(openssl rand -hex 16)
          ZAP_API_KEY=$(openssl rand -hex 16)
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$SCAN_PASSWORD"
          echo "::add-mask::$ZAP_API_KEY"
          echo "SCAN_PASSWORD=$SCAN_PASSWORD" >> "$GITHUB_ENV"
          echo "ZAP_API_KEY=$ZAP_API_KEY" >> "$GITHUB_ENV"
          docker run -d --name donantes -p 127.0.0.1:3000:3000 -e JWT_SECRET="$JWT_SECRET" donantes:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/health
          docker exec -e ADMIN_USERNAME=zapadministrador -e ADMIN_PASSWORD="$SCAN_PASSWORD" donantes node scripts/create-admin.js
          curl --fail http://127.0.0.1:3000/register -H 'Content-Type: application/json' -d "{\"username\":\"zapusuario\",\"password\":\"$SCAN_PASSWORD\"}"
          docker run -d --name zap --network host -v "$PWD:$PWD:rw" ghcr.io/zaproxy/zaproxy:stable zap.sh -daemon -host 127.0.0.1 -port 8090 -config api.key="$ZAP_API_KEY"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:8090/JSON/core/view/version/?apikey=$ZAP_API_KEY"; then break; fi
            sleep 2
          done
      - name: ZAP con ambos roles y evaluación de alertas
        if: github.event_name != 'pull_request'
        run: |
          python scripts/zap-scan.py
          python -c "import json; r=json.load(open('reports/seguridad/zap-ejecucion.json')); assert all(int(x['alertsSummary']['alertsSummary'].get(k,0))==0 for x in r['roles'] for k in ['High','Medium']), 'Alertas altas o medias pendientes'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-calidad-seguridad
          path: |
            coverage/
            reports/
      - name: Retirar entornos temporales
        if: always()
        run: docker rm -f donantes zap sonar || true
